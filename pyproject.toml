[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepdict"
version = "0.2.0"
description = "Cross-platform (Windows & macOS) global selection translator & multi-turn AI follow-up assistant powered by DeepSeek"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["translator", "deepseek", "dictionary", "desktop", "pyqt5", "windows", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyQt5>=5.15",
    "requests>=2.28",
    'pywin32>=306; sys_platform == "win32"',
    'comtypes>=1.4; sys_platform == "win32"',
    'uiautomation>=2.0; sys_platform == "win32"',
    'pynput>=1.7; sys_platform == "darwin"',
    'pyobjc-framework-Quartz>=9.0; sys_platform == "darwin"',
]

[project.urls]
Homepage = "https://github.com/huweisoog/deepdict"
Repository = "https://github.com/huweisoog/deepdict"
Issues = "https://github.com/huweisoog/deepdict/issues"

[project.scripts]
deepdict = "deepdict.app:main"

[project.gui-scripts]
deepdict-gui = "deepdict.app:main"

[tool.setuptools.packages.find]
include = ["deepdict*"]
